server:
  address: ${ACCEPTANCE_SERVER_ADDRESS:127.0.0.1}
  port: ${ACCEPTANCE_SERVER_PORT:8081}

spring:
  datasource:
    # Never inherit the development datasource while the acceptance profile is active.
    url: ${ACCEPTANCE_DB_URL:jdbc:postgresql://127.0.0.1:1/acceptance_database_not_configured}
    username: ${ACCEPTANCE_DB_USERNAME:acceptance_database_not_configured}
    password: ${ACCEPTANCE_DB_PASSWORD:acceptance_database_not_configured}

app:
  cors:
    allowed-origins: ${ACCEPTANCE_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  security:
    jwt:
      secret: ${ACCEPTANCE_JWT_SECRET:}
      issuer: ${ACCEPTANCE_JWT_ISSUER:beauty-center-acceptance}
      access-token-expiration: ${ACCEPTANCE_JWT_ACCESS_TOKEN_EXPIRATION:15m}
  acceptance-seed:
    enabled: ${ACCEPTANCE_SEED_ENABLED:false}
    owner-username: ${ACCEPTANCE_OWNER_USERNAME:}
    owner-password: ${ACCEPTANCE_OWNER_PASSWORD:}
    full-staff-username: ${ACCEPTANCE_FULL_STAFF_USERNAME:}
    full-staff-password: ${ACCEPTANCE_FULL_STAFF_PASSWORD:}
    receptionist-username: ${ACCEPTANCE_RECEPTIONIST_USERNAME:}
    receptionist-password: ${ACCEPTANCE_RECEPTIONIST_PASSWORD:}
