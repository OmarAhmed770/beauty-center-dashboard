# Local portfolio only. Never fall back to the client DB_* connection or JWT.
server:
  address: 127.0.0.1
  port: ${DEMO_SERVER_PORT:8082}
spring:
  datasource:
    url: ${DEMO_DB_URL:jdbc:postgresql://127.0.0.1:1/beauty_center_demo}
    username: ${DEMO_DB_USERNAME:beauty_demo_app}
    password: ${DEMO_DB_PASSWORD:}
app:
  demo:
    read-only: ${DEMO_READ_ONLY:true}
  cors:
    allowed-origins: ${DEMO_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5175,http://localhost:5175}
  security:
    jwt:
      secret: ${DEMO_JWT_SECRET:}
      issuer: beauty-center-portfolio-demo
  backup:
    enabled: false
    directory: ${DEMO_BACKUP_DIRECTORY:./tmp/demo-backups}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
